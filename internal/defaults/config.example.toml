[general]
# Define which wallpaper daemon to use
use_daemon = "awww"

# Define whether to use any theme generator
use_themer = "matugen"

# Define where the wallpaper should save
default_path = "/tmp"

[awww]
# Which filter to use when scaling images
# Values: "Nearest", "Bilinear", "CatmullRom", "Mitchell", "Lanczos3"
filter = "Lanczos3"

# Set the type of transition
# Values: "none", "simple", "fade", "left", "right", "top", "bottom", "wipe", "wave", "grow", "center", "any", "outer", "random"
transition_type = "simple"

# How fast the transition approaches the new image
# Larger values are faster and abrupt
# Smaller values are slower and seamless
transition_step = "2"

# How long the transition takes in seconds
# Does not work with transition_type "simple"
transition_duration = "3"

# This should be self-explanatory
transition_fps = "60"

# Used for transition_type "wipe" and "wave", controlling the angle
transition_angle = "45"

# Used for transition_type "grow" and "outer", controlling the center of the circle
# Values in Percent: "0.5,0.5" is 50% of width and 50% of height
# Values in Pixels: "200,400" is 200px from the left and 400px from the bottom
# Values in Alias: "center", "top", "left", "right", "bottom", "top-left", "top-right", "bottom-left", "bottom-right"
transition_pos = "center"

# Used for "fade" to control animation
transition_bezier = "0.54,0,0.34,0.99"

# Used for "wave" to control the width and height of the wave
transition_wave = "20,20"

[client]
wallhaven_api = "api_key"

[wallhaven]
# Filters results by search term. Leave empty for no filter.
query = ""

# Filters results by category. Each digit is a toggle (1=on, 0=off).
# Position: general | anime | people
# Example: "110" returns general and anime, excluding people.
categories = "010"

# Filters results by content rating. Each digit is a toggle (1=on, 0=off).
# Position: sfw | sketchy | nsfw
# Note: nsfw requires a valid API key in [client].
purity = "110"

# Controls how results are sorted.
# Values: "date_added", "relevance", "random", "views", "favorites", "toplist"
sorting = "random"

# Controls sort direction.
# Values: "desc", "asc"
order = "desc"

# Minimum resolution filter. Format: "WIDTHxHEIGHT"
at_least = "1920x1080"

# Filters by exact resolution. Format: "WIDTHxHEIGHT"
# Accepts comma-separated values or one value
resolution = "1920x1080,2560x1440,3840x2160,1920x1200,2560x1600,3840x2400,2560x1080,2440x1440,3840x1600"

# Filters by aspect ratio. Accepts comma-separated values.
# Example: "16x9,16x10"
ratios = "16x9,21x9,16x10,32x9,48x9"

# Randomness seed. Accepts alphanumeric values.
# Only applies when sorting is set to "random".
seed = ""

[matugen]
# Set color scheme:
# Values: "scheme-tonal-spot", "scheme-content", "scheme-expressive", "scheme-fidelity", "scheme-fruit-salad", "scheme-monochrome", "scheme-neutral", "scheme-rainbow", "scheme-vibrant"
scheme = "scheme-tonal-spot"

# Set color contrast
# Value: "1" = maximum, "-1" = minimum, "0" = standard
# Accepts float values e.g. "1.2", "0.8"
contrast = "0"

# Set light or dark mode
# Values: "light" or "dark"
mode = "light"

# Recommended not to change unless you know what you are doing
# 0 = chooses the most dominant color as the source, can vary between 0 to 4 (least dominant) but is not fixed
source-color-index = "0"

[wallust]
# Define how to extract the colors from the image
# Values: "full", "resized", "wal", "thumb", "thumb", "fastresize", "kmeans"
backend = "full"

# Define which color space of colors
# Values: "lab", "labmixed", "lch", "lchmixed", "salience", "lchansi"
colorspace = "lch"

# Define fallback generation if failed
# Values: "interpolate" and "complementary"
fallback = "interpolate"

# Define the color palette to use
# dark - dark16 - darkcomp - darkcomp16
# light - light16 - lightcomp - lightcomp16
# harddark - harddark16 - harddarkcomp - harddarkcomp16
# softdark - softdark16 - softdarkcomp - softdarkcomp16
# softlight - softlight16 - softlightcomp - softlightcomp16
# saliencedark - saliencedarkbalanced - saliencedarkdistributed - saliencedarklow (each has the 16 variations)
# salienceligh - saliencelightbalanced - saliencelightdistributed - saliencelightlow (each has the 16 variations)
palette = "dark16"

# Set color saturation
# Values: 1 - 100
saturation = "1"

# Set color threshold
# Values: 1 - 100
threshold = ""

#  Enable/disable dynamic threshold
# Doesn't work with manual threshold setting
dynamic_threshold = true
